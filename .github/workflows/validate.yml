name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate system files against schema
        run: python scripts/validate.py
      - name: Check README and data files are up to date
        run: |
          python scripts/build_readme.py
          python scripts/build_db.py
          if ! git diff --quiet README.md data/systems.json data/index.json; then
            echo "::error::Generated files are out of date. Run scripts/build_readme.py and scripts/build_db.py, then commit."
            git diff --stat README.md data/ | head -20
            exit 1
          fi
