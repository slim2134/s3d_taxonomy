name: Differentially Private Speaker Anonymization
developer: Shamsabadi et al. (Alan Turing Institute, INRIA, Vector Institute)
status: research
analysis_status: complete
date: 2023 (PoPETs)
source: https://petsymposium.org/popets/2023/popets-2023-0007.php
description: >-
  A speaker anonymization system that removes speaker identity from speech by introducing differentially
  private feature extractors based on an autoencoder and an automatic speech recognizer, providing provable
  privacy guarantees that prior state-of-the-art anonymization pipelines lack while maintaining high linguistic
  utility.
hoepman:
- strategy: hide
  rationale: removes speaker identity from speech so the voice cannot be linked back to the person
- strategy: abstract
  rationale: >-
    differentially private feature extractors bound how much identity information survives in the extracted
    features at all, giving provable guarantees prior anonymization pipelines lack
oecd:
- principle: security-safeguards
  rationale: the DP bound on identity leakage is formal, not empirical, while linguistic utility stays
    high
technologies:
- differentially-private-feature-extractors
- autoencoder-automatic-speech-recognizer-pipeline
techniques:
- dp-feature-extraction-over-speech
- identity-linguistic-content-separation
- utility-preserving-anonymized-speech-synthesis
