name: Password Monitoring / iCloud Keychain (Private Set Intersection)
developer: Apple
status: research
analysis_status: complete
date: September 2020
source: https://support.apple.com/guide/security/icloud-keychain-security-overview-sec1c89c6f3b/web
description: >-
  Syncs passwords and passkeys across a user's Apple devices without exposing them to Apple. Keychain
  items travel through Apple's servers but are end-to-end encrypted, so neither Apple nor an attacker
  who compromises iCloud can read them; the design also lets users recover their keychain even if all
  devices are lost.
hoepman:
- strategy: hide
  rationale: >-
    private set intersection lets the device check the user's passwords against Apple's breached-credential
    list without Apple ever learning the passwords
- strategy: minimise
  rationale: >-
    only blinded cryptographic representations are exchanged, and keychain material syncing through iCloud
    is end-to-end encrypted, so Apple holds nothing readable
oecd:
- principle: collection-limitation
  rationale: neither queried passwords nor keychain contents are ever collected in usable form
- principle: security-safeguards
  rationale: E2EE means even an attacker who compromises iCloud cannot read keychain items
technologies:
- private-set-intersection-protocol
- end-to-end-encrypted-icloud-keychain
techniques:
- oprf-style-blinding-of-password-derived-values
- bucketized-breach-corpus-lookup
- on-device-match-determination
