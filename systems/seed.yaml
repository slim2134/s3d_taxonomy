name: SEED
developer: University of Queensland
status: research
analysis_status: complete
date: 2026 (PoPETs)
source: https://petsymposium.org/popets/2026/popets-2026-0021.php
description: >-
  A framework for deploying containerized microservices in the cloud while keeping user code, data, and
  models secret and results verifiably correct. Unlike prior TEE designs, it runs the whole container
  stack inside the trusted enclave (on AMD SEV-SNP) yet shrinks the trusted footprint ~30× (22 MB vs ~690
  MB), using continuous in-enclave attestation to block cloud attacks and even hide workload identity.
  Runs real workloads (TensorFlow, PyTorch, Redis, NGINX) within ~5% of native speed.
hoepman:
- strategy: hide
  rationale: >-
    the entire container stack runs inside an AMD SEV-SNP enclave, keeping user code, data, and models
    secret — even the identity of the workload is hidden from the cloud
- strategy: demonstrate
  rationale: >-
    continuous in-enclave attestation proves, throughout execution, that the workload is running untampered,
    and results are verifiably correct
oecd:
- principle: security-safeguards
  rationale: >-
    enclave isolation plus a trusted footprint shrunk ~30x (22 MB vs ~690 MB) reduces the attack surface
    against cloud-level adversaries
technologies:
- amd-sev-snp-trusted-enclaves
- >-
  containerized-microservices-running-real-workloads-tensorflow-pytorch-redis-nginx-within-5-of-native-speed
techniques:
- full-stack-in-enclave-execution-with-a-minimized-22-mb-trusted-computing-base
- continuous-in-enclave-attestation
- workload-identity-hiding
