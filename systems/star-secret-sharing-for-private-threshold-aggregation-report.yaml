name: STAR (Secret Sharing for Private Threshold Aggregation Reporting)
developer: Brave
status: deployed
analysis_status: complete
date: September 2021
source: https://arxiv.org/abs/2109.10074
description: >-
  A threshold-aggregation system that reveals a client's report only when at least K other clients submit
  the identical value, using secret sharing and oblivious pseudorandom functions, so rare and potentially
  identifying responses are never decryptable.
hoepman:
- strategy: abstract
  rationale: >-
    A cryptographically enforced threshold means a value is only ever revealed in aggregate, providing
    k-anonymity on collected data.
- strategy: separate
  rationale: The secret-sharing construction keeps any individual report concealed until the threshold
    is met.
oecd:
- principle: collection-limitation
  rationale: Rare or identifying values are never decryptable, so they are effectively never collected.
technologies:
- threshold-aggregation-via-secret-sharing
- oblivious-pseudorandom-functions
- single-server-architecture
techniques:
- shamir-secret-sharing
- deterministic-key-derivation-from-data-value
- k-anonymity-threshold
notes: >-
  Deployed in Brave and Mozilla telemetry; reported 1773x faster, 62x less communication, and 24x cheaper
  than prior multi-server systems.
